server:
  port: 8080

spring:
  application:
    name: cart-service

  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5439}/carts_db
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8080}

order:
  service:
    url: ${ORDER_SERVICE_URL:http://localhost:8080}
