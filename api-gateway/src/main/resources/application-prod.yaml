server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: auth-service-api
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/auth/**

        - id: auth-service-docs
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/auth-service/v3/api-docs
          filters:
            - RewritePath=/auth-service/(?<segment>.*), /${segment}

        - id: order-service-api
          uri: ${ORDER_SERVICE_URL}
          predicates:
            - Path=/api/orders/**

        - id: order-service-docs
          uri: ${ORDER_SERVICE_URL}
          predicates:
            - Path=/order-service/v3/api-docs
          filters:
            - RewritePath=/order-service/(?<segment>.*), /${segment}

        - id: delivery-service-api
          uri: ${DELIVERY_SERVICE_URL}
          predicates:
            - Path=/api/deliveries/**

        - id: delivery-service-docs
          uri: ${DELIVERY_SERVICE_URL}
          predicates:
            - Path=/delivery-service/v3/api-docs
          filters:
            - RewritePath=/delivery-service/(?<segment>.*), /${segment}

        - id: payment-service-api
          uri: ${PAYMENT_SERVICE_URL}
          predicates:
            - Path=/api/payments/**

        - id: payment-service-docs
          uri: ${PAYMENT_SERVICE_URL}
          predicates:
            - Path=/payment-service/v3/api-docs
          filters:
            - RewritePath=/payment-service/(?<segment>.*), /${segment}

        - id: payment-webhook
          uri: ${PAYMENT_SERVICE_URL}
          predicates:
            - Path=/webhooks/**

        - id: user-service-api
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/api/users/**

        - id: user-service-docs
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            - RewritePath=/user-service/(?<segment>.*), /${segment}

        - id: user-service-actuator
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/user-service/actuator/**
          filters:
            - RewritePath=/user-service/(?<segment>.*), /${segment}

        - id: product-service-api
          uri: ${PRODUCT_SERVICE_URL}
          predicates:
            - Path=/api/products/**

        - id: product-service-docs
          uri: ${PRODUCT_SERVICE_URL}
          predicates:
            - Path=/product-service/v3/api-docs
          filters:
            - RewritePath=/product-service/(?<segment>.*), /${segment}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: order-service
        url: /order-service/v3/api-docs

      - name: delivery-service
        url: /delivery-service/v3/api-docs

      - name: payment-service
        url: /payment-service/v3/api-docs

      - name: user-service
        url: /user-service/v3/api-docs

      - name: product-service
        url: /product-service/v3/api-docs

jwt:
  secret: ${JWT_SECRET}